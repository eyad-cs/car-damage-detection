<!-- لكل قطعة طلب مستقل، لذلك تظهر نتيجتها دون انتظار بقية القطع. -->
{% for part in parts %}
<section class="box part-results">
  <h2>نتائج: {{ part }}</h2>
  <form class="part-search" hx-post="/search/products" hx-trigger="load, submit"
        hx-target="find .part-products" hx-indicator="find .loading" hx-disabled-elt="find button">
    {% for field in ['make', 'model', 'year', 'vin', 'partType'] %}
    <input type="hidden" name="{{ field }}" value="{{ data[field] }}">
    {% endfor %}
    <input type="hidden" name="partName" value="{{ part }}">
    <input type="hidden" name="group" value="{{ loop.index }}">
    <p class="loading" role="status">جاري البحث عن {{ part }}…</p>
    <div class="part-products" aria-live="polite"></div>
    <p class="connection-error" role="alert" hidden>تعذّر الاتصال بالموقع. أعد البحث عن هذه القطعة.</p>
    <button class="retry-button" type="submit">إعادة البحث عن هذه القطعة</button>
  </form>
</section>
{% endfor %}
